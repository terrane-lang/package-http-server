name: terrane-http-server-demo
services:
  http-server-demo:
    image: terrane-http-server-demo:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HTTP_SERVER_PORT:-3187}:3187"
    environment:
      PORT: "3187"
      ADDRESS: "0.0.0.0"
    restart: unless-stopped
    init: true
