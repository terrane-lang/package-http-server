  title: "create-application"
  title-style: code
  summary: Creates an empty HTTP server application with default address and permissive network policies.
  tags: [http-server, application, factory]
  blocks:
    - type: markdown
      markdown: |-
        `create-application` takes no parameters and returns a new `application`. Its initial
        listen address is `127.0.0.1:3000`; it has no routes and both network allowlists are
        empty (permissive). The internal constructor is private; obtain an application only
        through this factory. See [[http-server.api.application]] and
        [[http-server.guide.application-routing]].
