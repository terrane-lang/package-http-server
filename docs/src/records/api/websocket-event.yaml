  title: "websocket-event"
  title-style: code
  summary: Event record returned by receiving a WebSocket frame or observing stream closure.
  tags: [http-server, websocket, events]
  blocks:
    - type: markdown
      markdown: |-
        Public constructor `websocket-event(kind: string, text: string|none)` initializes
        public fields `kind` and `text`. Their defaults are `closed` and `none`. A receive
        from [[http-server.api.websocket-session]] maps native text to lower-case kind
        `text` with its payload in `text`; all other native variants retain their native
        variant names (`Close`, `Binary`, `Ping`, `Pong`) and have no text payload. A stream
        end maps to lower-case `closed` with no text. Thus `closed` and `Close` are distinct:
        the former means no message was received because the stream ended; the latter is a
        received close frame.
