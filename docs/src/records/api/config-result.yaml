  title: "config-result"
  title-style: code
  summary: Result record carrying YAML parse status, explanatory message, and server configuration.
  tags: [http-server, configuration, yaml]
  blocks:
    - type: markdown
      markdown: |-
        `config-result` has a public constructor `config-result(failed: bool, message: string,
        config: server-config)`. Its public fields are `failed`, `message`, and `config`.
        Field defaults are `false`, `''`, and a default-address server config with empty
        controller and static-directory lists. Parser failures return `failed: true`, the
        diagnostic message, and a fresh default config; success returns `false`, an empty
        message, and the parsed config.

        See [[http-server.api.parse-config-yaml]] for the exact failure conditions and
        message forms.
