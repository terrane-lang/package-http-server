  title: "static-mount"
  title-style: code
  summary: Configuration record describing a static directory and its URL path.
  tags: [http-server, configuration, static-files]
  blocks:
    - type: markdown
      markdown: |-
        Public constructor `static-mount(path: string, directory: string)` initializes its
        public `path` and `directory` fields from the parameters. Their field defaults are
        `/static` and `public`. The record itself does not mount or validate the directory;
        `application.static-directory` performs the mounting and underlying service
        registration.

        YAML mount parsing requires a nonempty path beginning with `/`, and checks duplicate
        paths against controller and static mounts. Direct construction has no such package
        validator. See [[http-server.api.server-config]], [[http-server.api.application]],
        and [[http-server.api.parse-config-yaml]].
