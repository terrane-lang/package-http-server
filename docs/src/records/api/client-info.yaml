  title: "client-info"
  title-style: code
  summary: Read-only peer and resolved-client IP values supplied to a client-aware GET handler.
  tags: [http-server, client-address, routing]
  blocks:
    - type: markdown
      markdown: |-
        `client-info` has a private constructor and is supplied only by the framework to a
        `routes.get-with-client` handler. It contains private optional peer and client IP
        values; callers cannot construct or mutate it through the public API.

        `peer-ip() -> ip-addr|none` returns the TCP peer address, if available.
        `client-ip() -> ip-addr|none` returns the resolved client address, if available.
        Resolution may use trusted forwarded headers according to the application's direct
        connection policy; it is not necessarily the peer. See
        [[http-server.guide.proxy-security]].
