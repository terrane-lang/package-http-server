  title: "controller-mount"
  title-style: code
  summary: Configuration record associating a controller identifier with an application path.
  tags: [http-server, configuration, routing]
  blocks:
    - type: markdown
      markdown: |-
        Public constructor `controller-mount(id: string, path: string)` initializes public
        fields `id` and `path` to the supplied strings. Their field defaults before explicit
        initialization are `''` and `/`, respectively. The type carries configuration data;
        it does not resolve the identifier to a controller object.

        `server-config.controller-path(id)` searches controller mounts in list order and
        returns the first matching path as `string|none`, or `none` when absent. Identifiers
        are ordinary strings. YAML parsing enforces unique IDs among controller mounts and
        unique paths across both mount kinds; direct construction does not add those checks.
        See [[http-server.api.server-config]] and [[http-server.api.parse-config-yaml]].
