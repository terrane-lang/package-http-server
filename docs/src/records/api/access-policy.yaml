documentation:
  status: complete
  title: "access-policy"
  title-style: code
  summary: Standalone mutable configuration value for direct and client address network lists.
  tags: [http-server, access-control, client-address]
  blocks:
    - type: markdown
      markdown: |-
        `access-policy` has a public zero-argument constructor. Its public fields
        `direct-connections: list of string` and `client-addresses: list of string` start
        empty. Strings represent IP addresses or CIDR networks; entries are parsed when a
        server starts, so invalid values fail at that time.

        `allow-direct(network: string) -> access-policy` and
        `allow-client(network: string) -> access-policy` are consuming builders: each appends
        the supplied string to the respective public list and returns the policy. The lists
        may also be mutated directly through their public fields.

        This is a standalone public value, not an application configuration hook: no public
        `application` setter accepts an `access-policy`. Configure an application's two
        policies with `application.allow-direct` and `application.allow-client` instead. See
        [[http-server.guide.proxy-security]] for enforcement and forwarding behavior.
