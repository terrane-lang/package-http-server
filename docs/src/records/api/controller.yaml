  title: "controller"
  title-style: code
  summary: Interface implemented by application components to construct controller-local routes.
  tags: [http-server, controller, routing]
  blocks:
    - type: markdown
      markdown: |-
        `controller` is a public interface, not a constructible class. Implement its single
        member `consuming function routes(routes) -> routes` (parameter name in the source is
        `registered-routes`). The framework provides an empty builder scoped to this
        controller, consumes it through the callback, and mounts the returned builder.
        Register relative paths using [[http-server.api.routes]].

        The interface declares no explicit throws clause. Its callback can nevertheless
        encounter failures from delegated projected routing operations; absence of a
        declared clause is not a guarantee that all underlying operations are infallible.
